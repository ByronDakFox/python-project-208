{% extends "base.html" %}

{% block content %}
  <h1 class="my-4">Etiquetas</h1>
  <a class="btn btn-primary mb-3" href="{% url 'labels_create' %}">
    Crear etiqueta
  </a>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Fecha de creación</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for label in label_list %}
        <tr>
          <td>{{ label.pk }}</td>
          <td>{{ label.name }}</td>
          <td>{{ label.created_at|date:"d/m/Y H:i" }}</td>
          <td>
            <a href="{% url 'labels_update' label.pk %}">Editar</a>
            <a href="{% url 'labels_delete' label.pk %}">Eliminar</a>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
